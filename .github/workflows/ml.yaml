name: ML

on:
    workflow_dispatch:

jobs:
    build:
        name: Build prod images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            -   name: Docker Meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: |
                        ghcr.io/cvvfcm/website/php
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            - name: Build and Push
              uses: docker/bake-action@v6
              env:
                  EXTERNAL_USER_ID: 33
                  TAGS: "${{ steps.meta.outputs.version }}${{ github.event_name == 'release' && ',latest' || '' }}"
              with:
                  files: |
                      compose.yaml
                      docker-bake.hcl
                  targets: ml
                  push: true
                  set: |
                      ml.cache-from=type=gha,scope=ml-main
                      ml.cache-from=type=gha,scope=ml-${{ github.ref_name }}
                      ml.cache-to=type=gha,scope=ml-${{ github.ref_name }},mode=max

    build-ml-preprod:
        name: Build PREPROD weather model
        runs-on: ubuntu-latest
        needs: [ build ]
        environment: PREPROD
        env:
            IMAGE_TAG: ${{ github.ref_name }}
            EXTERNAL_USER_ID: 33
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v1
                with:
                    version: latest

            -   name: Fetch up-to-date CSV weather file
                run: |
                    mkdir -p ./data/weather/ml
                    docker compose -p cvvfcm-preprod -f compose.yaml exec php bin/console app:export:weather-for-ml > ./data/weather/ml/ml.csv
                env:
                    DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'

            -   name: Build ONNX Model
                run: |
                    docker compose run --rm ml python ./src/train_forecast_model.py

            -   name: Set up private key
                run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            -   name: Trust remote host
                run: ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

            -   name: Copy to PREPROD
                run: |
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/model_pytorch.onnx php:/app/data/weather/ml/
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/model_pytorch.onnx.data php:/app/data/weather/ml/
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/scaler_params.json php:/app/data/weather/ml/
                env:
                    DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'

name: ML

on:
    workflow_dispatch:

jobs:
    build-ml-preprod:
        name: Build PREPROD weather model
        runs-on: ubuntu-latest
        environment: PREPROD
        env:
            IMAGE_TAG: ml-1001
            EXTERNAL_USER_ID: 1001
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest

            -   name: Set up private key
                run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            -   name: Trust remote host
                run: ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

            -   name: Fetch up-to-date CSV weather file
                run: |
                    mkdir -p ./data/weather/ml
                    docker compose -p cvvfcm-preprod -f compose.yaml exec php bin/console app:export:weather-for-ml > ./data/weather/ml/ml.csv
                env:
                    DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'

            -   name: Docker login
                run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            -   name: Build ONNX Model
                # --build: the ml image is no longer pushed by CD, build it fresh on the runner.
                run: docker compose -fcompose.yaml run --rm --build -v./data/weather/ml:/app/data/weather/ml ml python src/train_forecast_model.py

            -   name: Copy to PREPROD
                run: |
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/model_pytorch.onnx php:/app/data/weather/ml/
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/model_pytorch.onnx.data php:/app/data/weather/ml/
                    docker compose -p cvvfcm-preprod -f compose.yaml cp ./data/weather/ml/scaler_params.json php:/app/data/weather/ml/
                env:
                    DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'

            -   uses: actions/upload-artifact@v7
                with:
                    name: weather-model-preprod
                    path: ./data/weather/ml

name: CI

on:
    push:
        branches:
            - main
        # Root-level docs only: nested .md files (e.g. config/prompts/*.md) are app content.
        paths-ignore:
            - '*.md'
    pull_request: ~
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        env:
            EXTERNAL_USER_ID: 1001
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: Build Docker images
                uses: docker/bake-action@v7
                with:
                    pull: true
                    load: true
                    push: false
                    files: |
                        compose.yaml
                        compose.override.yaml
                    set: |
                        php.cache-from=type=gha,scope=php-main
                        php.cache-from=type=gha,scope=php-${{ github.ref_name }}
                        php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max
                        consumer.cache-from=type=gha,scope=consumer-main
                        consumer.cache-from=type=gha,scope=consumer-${{ github.ref_name }}
                        consumer.cache-to=type=gha,scope=consumer-${{ github.ref_name }},mode=max
                        ml.cache-from=type=gha,scope=ml-main
                        ml.cache-from=type=gha,scope=ml-${{ github.ref_name }}
                        ml.cache-to=type=gha,scope=ml-${{ github.ref_name }},mode=max
                        rtsp-to-web.cache-from=type=gha,scope=rtsp-main
                        rtsp-to-web.cache-from=type=gha,scope=rtsp-${{ github.ref_name }}
                        rtsp-to-web.cache-to=type=gha,scope=rtsp-${{ github.ref_name }},mode=max
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest
            -   name: Install mkcert & Generate SSL certificates
                run: |
                    sudo apt-get install libnss3-tools
                    wget -O mkcert "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
                    sudo mv mkcert /usr/local/bin/mkcert
                    sudo chmod +x /usr/local/bin/mkcert
                    mkcert -install
                    mkdir -p .infra/tls
                    mkcert -key-file .infra/tls/key.pem -cert-file .infra/tls/cert.pem localhost
            -   name: Cache Composer dependencies
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-
            -   name: Composer install
                run: |
                    mkdir -p var/cache/dev var/cache/test var/log
                    docker compose run --rm php composer install
            -   name: Cache NPM dependencies
                uses: actions/cache@v5
                with:
                    path: assets/admin/node_modules
                    key: npm-admin-${{ hashFiles('assets/admin/package-lock.json') }}
                    restore-keys: npm-admin-
            -   name: Admin NPM install
                run: |
                    docker run --rm -v ${PWD}:/app -w /app/assets/admin node:22-bookworm-slim npm install
                    docker run --rm -v ${PWD}:/app -w /app/assets/admin node:22-bookworm-slim npm run build
            -   name: Start services
                run: docker compose up --wait php --wait consumer --no-build || (docker compose logs && exit 1)
            -   name: Create test database
                run: docker compose exec -T php composer reset-test
            -   name: Run PHPUnit
                run: docker compose exec -T php bin/phpunit
            -   name: Doctrine Schema Validator
                run: docker compose exec -T php bin/console -e test doctrine:schema:validate

    psalm:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: write
        name: Static Analysis
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Psalm
                uses: docker://ghcr.io/psalm/psalm-github-actions
                with:
                    show_info: true
                    php_version: '8.5'
                    composer_require_dev: true
                    composer_ignore_platform_reqs: true

    lint:
        runs-on: ubuntu-latest
        name: Lint
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'

            -   name: Cache Composer dependencies
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-

            -   name: Install dependencies
                uses: ramsey/composer-install@v3

            -   name: Twig Lint
                run: php bin/console lint:twig --format=github templates

            -   name: Container Lint
                run: php bin/console lint:container

            -   name: YAML Lint
                run: find config -name "*.yaml" | xargs php bin/console lint:yaml --format=github

            -   name: Translations Lint
                run: php bin/console lint:translations --locale=fr

            -   name: Lint Dockerfile
                uses: hadolint/hadolint-action@v3.1.0

    cs:
        runs-on: ubuntu-latest
        name: Code Style
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'

            -   name: Cache Composer dependencies
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-

            -   name: Install dependencies
                uses: ramsey/composer-install@v3

            -   name: PHP CS Fixer
                run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

            -   name: Twig CS Fixer
                run: ./vendor/bin/twig-cs-fixer lint --report=github

    eslint:
        runs-on: ubuntu-latest
        name: ESLint
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Cache NPM dependencies
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: npm-root-${{ hashFiles('package-lock.json') }}
                    restore-keys: npm-root-

            -   name: Install dependencies
                run: npm ci

            -   name: ESLint
                run: npx eslint assets/website

    stylelint:
        runs-on: ubuntu-latest
        name: StyleLint
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Cache NPM dependencies
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: npm-root-${{ hashFiles('package-lock.json') }}
                    restore-keys: npm-root-

            -   name: Install dependencies
                run: npm ci

            -   name: StyleLint
                run: npx stylelint assets/website/**/*.css

    python_cs:
        runs-on: ubuntu-latest
        name: Python Code Style
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Python
                uses: actions/setup-python@v6
                with:
                    python-version: '3.13'
    
            -   name: Run Ruff (in ml folder)
                uses: astral-sh/ruff-action@v1

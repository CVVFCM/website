name: Screenshots

on:
    push:
        branches: [ main ]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    screenshots:
        name: Visual regression
        runs-on: ubuntu-latest
        env:
            EXTERNAL_USER_ID: 1001
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: Build the php image
                uses: docker/bake-action@v7
                with:
                    pull: true
                    load: true
                    push: false
                    targets: php
                    files: |
                        compose.yaml
                        compose.override.yaml
                    set: |
                        php.cache-from=type=gha,scope=php-main
                        php.cache-from=type=gha,scope=php-${{ github.ref_name }}
                        php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest
            -   name: Cache Composer dependencies
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-
            -   name: Composer install
                run: |
                    mkdir -p var/cache/test var/log
                    docker compose run --rm php composer install
            # php-test serves plain HTTP on the compose network, so no certificate is needed here —
            # unlike the `tests` job, which talks to the dev container over TLS.
            -   name: Start the test server
                run: |
                    docker compose --profile screenshots up --wait database --no-build
                    docker compose --profile screenshots up -d php-test --no-build
            -   name: Load the fixtures
                run: docker compose --profile screenshots exec -T php-test composer reset-test
            # Both halves matter: cache:clear drops the asset map on disk, the restart drops the copy
            # the FrankenPHP workers hold in memory. Without the restart the workers keep serving a
            # stylesheet whose @import names a stale content hash, the import 404s, and the pages are
            # photographed without those rules.
            -   name: Refresh the asset map
                run: |
                    docker compose --profile screenshots exec -T php-test php bin/console -etest cache:clear
                    docker compose --profile screenshots restart php-test
            -   name: Cache NPM dependencies
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: npm-${{ hashFiles('package-lock.json') }}
                    restore-keys: npm-
            -   name: Install Playwright
                run: docker compose --profile screenshots run --rm --no-deps playwright npm ci --no-audit --no-fund
            -   name: Compare against the baselines
                run: docker compose --profile screenshots run --rm playwright npx playwright test
            # A failed pixel comparison is unreadable from a log: what is needed is the expected
            # image, the received one and the diff between them.
            -   name: Publish the report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: screenshots-report
                    path: |
                        playwright-report/
                        test-results/
                    retention-days: 14

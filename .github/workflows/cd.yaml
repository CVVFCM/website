name: CD

on:
    release:
        types: [ published ]
    push:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    build:
        name: Build prod images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            -   name: Docker Meta
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: |
                        ghcr.io/cvvfcm/website/php
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            - name: Build and Push
              uses: docker/bake-action@v7
              env:
                  EXTERNAL_USER_ID: 33
                  # Always tag with the commit SHA (Helm deploys image.tag=${{ github.sha }}).
                  TAGS: "${{ steps.meta.outputs.version }},${{ github.sha }}${{ github.event_name == 'release' && ',latest' || '' }}"
              with:
                  files: |
                      compose.yaml
                      docker-bake.hcl
                  targets: |
                      php
                      consumer
                      ml
                      rtsp-to-web
                  push: true
                  set: |
                      php.cache-from=type=gha,scope=php-main
                      php.cache-from=type=gha,scope=php-${{ github.ref_name }}
                      php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max
                      consumer.cache-from=type=gha,scope=consumer-main
                      consumer.cache-from=type=gha,scope=consumer-${{ github.ref_name }}
                      consumer.cache-to=type=gha,scope=consumer-${{ github.ref_name }},mode=max
                      ml.cache-from=type=gha,scope=ml-main
                      ml.cache-from=type=gha,scope=ml-${{ github.ref_name }}
                      ml.cache-to=type=gha,scope=ml-${{ github.ref_name }},mode=max
                      rtsp-to-web.cache-from=type=gha,scope=rtsp-main
                      rtsp-to-web.cache-from=type=gha,scope=rtsp-${{ github.ref_name }}
                      rtsp-to-web.cache-to=type=gha,scope=rtsp-${{ github.ref_name }},mode=max

    deploy-preprod:
        name: Deploy to PREPROD
        needs: [ build ]
        uses: ./.github/workflows/deploy.yaml
        secrets: inherit
        with:
            environment: PREPROD
            namespace: cvvfcm-preprod
            host: preprod.cvvfcm.fr
            s3-bucket: cvvfcm-preprod
            disallow-robots: true

    deploy-prod:
        name: Deploy to PROD
        needs: [ build ]
        if: github.event_name == 'release'
        uses: ./.github/workflows/deploy.yaml
        secrets: inherit
        with:
            environment: PROD
            namespace: cvvfcm
            host: cvvfcm.fr
            s3-bucket: cvvfcm

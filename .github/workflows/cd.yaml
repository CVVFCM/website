name: CD

on:
    release:
        types: [ published ]
    push:
        branches: [ main ]
        # Root-level docs only: nested .md files (e.g. config/prompts/*.md, the Forgie
        # prompt) are shipped in the image and must trigger a build.
        paths-ignore:
            - '*.md'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    build:
        name: Build prod images (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    -   platform: linux/amd64
                        arch: amd64
                        runner: ubuntu-latest
                    -   platform: linux/arm64
                        arch: arm64
                        runner: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            # Each platform builds natively (no QEMU) and pushes untagged images by digest;
            # the merge job assembles the multi-arch manifests and applies the tags.
            -   name: Build and push by digest
                id: bake
                uses: docker/bake-action@v7
                env:
                    EXTERNAL_USER_ID: 33
                with:
                    files: |
                        compose.yaml
                        docker-bake.hcl
                    targets: |
                        php
                        consumer
                        rtsp-to-web
                    push: true
                    set: |
                        *.platform=${{ matrix.platform }}
                        *.tags=
                        php.output=type=image,name=ghcr.io/cvvfcm/website/php,push-by-digest=true,name-canonical=true,push=true
                        consumer.output=type=image,name=ghcr.io/cvvfcm/website/consumer,push-by-digest=true,name-canonical=true,push=true
                        rtsp-to-web.output=type=image,name=ghcr.io/cvvfcm/website/rtsp-to-web,push-by-digest=true,name-canonical=true,push=true
                        php.cache-from=type=registry,ref=ghcr.io/cvvfcm/website/php:cache-${{ matrix.arch }}
                        php.cache-to=type=registry,ref=ghcr.io/cvvfcm/website/php:cache-${{ matrix.arch }},mode=max
                        consumer.cache-from=type=registry,ref=ghcr.io/cvvfcm/website/consumer:cache-${{ matrix.arch }}
                        consumer.cache-to=type=registry,ref=ghcr.io/cvvfcm/website/consumer:cache-${{ matrix.arch }},mode=max
                        rtsp-to-web.cache-from=type=registry,ref=ghcr.io/cvvfcm/website/rtsp-to-web:cache-${{ matrix.arch }}
                        rtsp-to-web.cache-to=type=registry,ref=ghcr.io/cvvfcm/website/rtsp-to-web:cache-${{ matrix.arch }},mode=max

            -   name: Export digests
                run: |
                    mkdir -p "${{ runner.temp }}/digests"
                    echo "$BAKE_METADATA" | jq -r 'to_entries[] | "\(.key) \(.value."containerimage.digest")"' \
                        | while read -r target digest; do
                            echo "$digest" > "${{ runner.temp }}/digests/${target}-${{ matrix.arch }}"
                        done
                env:
                    BAKE_METADATA: ${{ steps.bake.outputs.metadata }}

            -   name: Upload digests
                uses: actions/upload-artifact@v4
                with:
                    name: digests-${{ matrix.arch }}
                    path: ${{ runner.temp }}/digests/*
                    if-no-files-found: error
                    retention-days: 1

    merge:
        name: Merge manifests
        needs: [ build ]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Download digests
                uses: actions/download-artifact@v4
                with:
                    pattern: digests-*
                    path: ${{ runner.temp }}/digests
                    merge-multiple: true
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            -   name: Docker Meta
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: |
                        ghcr.io/cvvfcm/website/php
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            -   name: Create multi-arch manifests
                env:
                    # Always tag with the commit SHA (Helm deploys image.tag=${{ github.sha }}).
                    TAGS: "${{ steps.meta.outputs.version }},${{ github.sha }}${{ github.event_name == 'release' && ',latest' || '' }}"
                run: |
                    for image in php consumer rtsp-to-web; do
                        repository="ghcr.io/cvvfcm/website/${image}"
                        tag_args=""
                        for tag in ${TAGS//,/ }; do
                            tag_args="${tag_args} -t ${repository}:${tag}"
                        done
                        docker buildx imagetools create ${tag_args} \
                            "${repository}@$(cat "${{ runner.temp }}/digests/${image}-amd64")" \
                            "${repository}@$(cat "${{ runner.temp }}/digests/${image}-arm64")"
                    done

            -   name: Inspect manifests
                run: |
                    for image in php consumer rtsp-to-web; do
                        docker buildx imagetools inspect "ghcr.io/cvvfcm/website/${image}:${{ github.sha }}"
                    done

    deploy-preprod:
        name: Deploy to PREPROD
        needs: [ merge ]
        uses: ./.github/workflows/deploy.yaml
        secrets: inherit
        with:
            environment: PREPROD
            namespace: cvvfcm-preprod
            host: preprod.cvvfcm.fr
            s3-bucket: cvvfcm-preprod
            disallow-robots: true

    deploy-prod:
        name: Deploy to PROD
        needs: [ merge ]
        if: github.event_name == 'release'
        uses: ./.github/workflows/deploy.yaml
        secrets: inherit
        with:
            environment: PROD
            namespace: cvvfcm
            host: cvvfcm.fr
            s3-bucket: cvvfcm

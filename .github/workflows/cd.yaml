name: CD

on:
    release:
        types: [ published ]
    push:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    build:
        name: Build prod images
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: 'Login to GitHub Container Registry'
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{github.actor}}
                    password: ${{secrets.GITHUB_TOKEN}}

            -   name: Docker Meta
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: |
                        ghcr.io/cvvfcm/website/php
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            - name: Build and Push
              uses: docker/bake-action@v7
              env:
                  EXTERNAL_USER_ID: 33
                  TAGS: "${{ steps.meta.outputs.version }}${{ github.event_name == 'release' && ',latest' || '' }}"
              with:
                  files: |
                      compose.yaml
                      docker-bake.hcl
                  targets: |
                      php
                      consumer
                      ml
                      rtsp-to-web
                  push: true
                  set: |
                      php.cache-from=type=gha,scope=php-main
                      php.cache-from=type=gha,scope=php-${{ github.ref_name }}
                      php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max
                      consumer.cache-from=type=gha,scope=consumer-main
                      consumer.cache-from=type=gha,scope=consumer-${{ github.ref_name }}
                      consumer.cache-to=type=gha,scope=consumer-${{ github.ref_name }},mode=max
                      ml.cache-from=type=gha,scope=ml-main
                      ml.cache-from=type=gha,scope=ml-${{ github.ref_name }}
                      ml.cache-to=type=gha,scope=ml-${{ github.ref_name }},mode=max
                      rtsp-to-web.cache-from=type=gha,scope=rtsp-main
                      rtsp-to-web.cache-from=type=gha,scope=rtsp-${{ github.ref_name }}
                      rtsp-to-web.cache-to=type=gha,scope=rtsp-${{ github.ref_name }},mode=max

    deploy-preprod:
        name: Deploy to PREPROD
        runs-on: ubuntu-latest
        needs: [ build ]
        environment: PREPROD
        env:
            DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'
            APP_ENV: ${{ vars.APP_ENV }}
            APP_SECRET: ${{ secrets.APP_SECRET }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            SERVER_SCHEME: ${{ vars.SERVER_SCHEME }}
            SERVER_NAME: ${{ vars.SERVER_NAME }}
            MAILER_DSN: ${{ secrets.MAILER_DSN }}
            SULU_ADMIN_EMAIL: ${{ vars.SULU_ADMIN_EMAIL }}
            SYMFONY_DECRYPTION_SECRET: ${{ secrets.SYMFONY_DECRYPTION_SECRET }}
            IMAGE_TAG: ${{ github.ref_name }}
            S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
            S3_KEY: ${{ secrets.S3_KEY }}
            S3_SECRET: ${{ secrets.S3_SECRET }}
            S3_BUCKET: ${{ secrets.S3_BUCKET }}
            S3_REGION: ${{ secrets.S3_REGION }}
            NETWORK_EXTERNAL: ${{ secrets.NETWORK_EXTERNAL }}
            NETWORK_NAME: ${{ secrets.NETWORK_NAME }}
            EXTERNAL_USER_ID: 33
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest
            -   name: Set up private key
                run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            -   name: Trust remote host
                run: ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
            -   name: Docker login
                run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            -   name: Deploy to staging
                run: docker compose -p cvvfcm-preprod -f compose.yaml up -d --pull always --wait php --wait consumer --force-recreate --no-build --remove-orphans || (docker compose logs && exit 1)
            -   name: Prune server
                run: docker system prune -f --all --volumes

    deploy-prod:
        name: Deploy to PROD
        runs-on: ubuntu-latest
        needs: [ build ]
        environment: PROD
        if: github.event_name == 'release'
        env:
            DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'
            APP_ENV: ${{ vars.APP_ENV }}
            APP_SECRET: ${{ secrets.APP_SECRET }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            SERVER_SCHEME: ${{ vars.SERVER_SCHEME }}
            SERVER_NAME: ${{ vars.SERVER_NAME }}
            MAILER_DSN: ${{ secrets.MAILER_DSN }}
            SULU_ADMIN_EMAIL: ${{ vars.SULU_ADMIN_EMAIL }}
            SYMFONY_DECRYPTION_SECRET: ${{ secrets.SYMFONY_DECRYPTION_SECRET }}
            IMAGE_TAG: ${{ github.ref_name }}
            S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
            S3_KEY: ${{ secrets.S3_KEY }}
            S3_SECRET: ${{ secrets.S3_SECRET }}
            S3_BUCKET: ${{ secrets.S3_BUCKET }}
            S3_REGION: ${{ secrets.S3_REGION }}
            NETWORK_EXTERNAL: ${{ secrets.NETWORK_EXTERNAL }}
            NETWORK_NAME: ${{ secrets.NETWORK_NAME }}
            EXTERNAL_USER_ID: 33
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Set up Docker Compose
                uses: docker/setup-compose-action@v2
                with:
                    version: latest
            -   name: Set up private key
                run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
            -   name: Trust remote host
                run: ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
            -   name: Docker login
                run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            -   name: Deploy to staging
                run: docker compose -p cvvfcm -f compose.yaml up -d --pull always --wait php --wait consumer --force-recreate --no-build --remove-orphans || (docker compose logs && exit 1)
            -   name: Prune server
                run: docker system prune -f --all --volumes

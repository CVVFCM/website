services:
    php:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}php:${IMAGE_TAG:-latest}
        depends_on: [ database, rtsp-to-web ]
        restart: unless-stopped
        build:
            target: php
            args:
                EXTERNAL_USER_ID: ${EXTERNAL_USER_ID}
        environment: &php-env
            SERVER_NAME: ${SERVER_SCHEME:-https://}${SERVER_NAME:-localhost}
            APP_SECRET: ${APP_SECRET:-!ChangeMe!}
            MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
            DATABASE_URL: ${DATABASE_URL:-pgsql://${POSTGRES_USER:-cvvfcm}:${POSTGRES_PASSWORD:-cvvfcm}@database:5432/${POSTGRES_DB:-cvvfcm}?serverVersion=18&charset=utf8}
            SULU_ADMIN_EMAIL: ${SULU_ADMIN_EMAIL:-"CVVFCM <contact@cvvfcm.fr>"}
            APP_ENV: ${APP_ENV:-prod}
            SYMFONY_DECRYPTION_SECRET: ${SYMFONY_DECRYPTION_SECRET:-}
            S3_KEY: ${S3_KEY:-}
            S3_SECRET: ${S3_SECRET:-}
            S3_ENDPOINT: ${S3_ENDPOINT:-}
            S3_REGION: ${S3_REGION:-eu-west-3}
            S3_BUCKET: ${S3_BUCKET:-cvvfcm}
            # Mercure hub is embedded in the php (FrankenPHP) container; "php" resolves on the
            # compose network, so the consumer publishes to it too. Literal (not ${MERCURE_URL:-…}):
            # compose would interpolate that from .env, whose localhost value is wrong for the consumer.
            MERCURE_URL: http://php/.well-known/mercure
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}/.well-known/mercure}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            # MISTRAL_API_KEY intentionally NOT set here: an empty real env var would shadow the
            # value from .env.local (Symfony dotenv precedence). Dev key lives in .env.local; k8s
            # injects the real env var via the helm secret.
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=${NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_default}'
            - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${SERVER_NAME:-localhost}`)'
            - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true'
            - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt'
            - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.domains[0].main=${SERVER_NAME:-localhost}'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - search_indexes:/app/var/indexes
            - thumbnails:/app/public/uploads

    rtsp-to-web:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}rtsp-to-web:${IMAGE_TAG:-latest}
        restart: unless-stopped
        build:
            context: .infra/docker/rtsp-to-web
            target: rtsp-to-web
        environment:
            HTTP_LOGIN: '${RTSP_TO_WEB_HTTP_LOGIN:-admin}'
            HTTP_PASSWORD: '${RTSP_TO_WEB_HTTP_PASSWORD:-!ChangeMe!}'

    ml:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}ml:${IMAGE_TAG:-latest}
        build:
            context: ml
            target: python
            args:
                EXTERNAL_USER_ID: ${EXTERNAL_USER_ID}

    consumer:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}consumer:${IMAGE_TAG:-latest}
        depends_on: [ database ]
        restart: unless-stopped
        build:
            target: consumer
            args:
                EXTERNAL_USER_ID: ${EXTERNAL_USER_ID}
        environment: *php-env

    # DB backup runner (pg_dump | restic → S3). Not started with the stack; built here so the CI
    # bake picks it up as a target, and runnable on demand: `docker compose run --rm backup`.
    backup:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}backup:${IMAGE_TAG:-latest}
        profiles: [ backup ]
        build:
            target: backup
        depends_on: [ database ]

    # Serves the test database and its fixtures for the screenshot suite. Kept apart from `php` so a
    # visual run never disturbs the dev container, and deliberately without published ports: the
    # only client is the playwright service, which reaches it by name on the compose network.
    # SERVER_NAME=:80 makes Caddy serve plain HTTP — no certificate to trust from inside a container.
    php-test:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}php:${IMAGE_TAG:-latest}
        profiles: [ screenshots ]
        depends_on: [ database ]
        build:
            target: php
            args:
                EXTERNAL_USER_ID: ${EXTERNAL_USER_ID}
        environment:
            <<: *php-env
            APP_ENV: test
            SERVER_NAME: ':80'
        command: [ "frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile" ]

    # Pinned to the same version as @playwright/test in package.json: the library and the browser it
    # drives must match. Running the browser from this image is what makes a baseline captured on a
    # laptop comparable with a run in CI — same Chromium, same fonts, same rasteriser.
    playwright:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
        profiles: [ screenshots ]
        depends_on: [ php-test ]
        working_dir: /app
        user: '${EXTERNAL_USER_ID:-1000}'
        # Shares php-test's network namespace so the site answers on http://localhost. Sulu resolves
        # its portal by hostname and only knows `localhost`; reaching the container by service name
        # returns a fatal "no portal for this URL" page — with a 200 status, so it looks fine until
        # you open the screenshot.
        network_mode: 'service:php-test'
        environment:
            SCREENSHOT_BASE_URL: http://localhost
            # The browsers ship with the image; nothing to download here or on the host.
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            CI: ${CI:-}
        volumes:
            - '.:/app:rw'

    database:
        image: postgres:18
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cvvfcm}
            POSTGRES_USER: ${POSTGRES_USER:-cvvfcm}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvvfcm}
        volumes:
            - database_data:/var/lib/mysql


volumes:
    caddy_data:
    caddy_config:
    database_data:
    search_indexes:

    thumbnails:

networks:
    default:
        external: ${NETWORK_EXTERNAL:-false}
        name: ${NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_default}

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_locale: fr

    env(WEATHER_CLOUD_DEVICE_CODE): '9707513599'

    env(FACEBOOK_APP_ID): ''
    env(FACEBOOK_APP_SECRET): ''
    env(FACEBOOK_PAGE_ID): ''
    env(FACEBOOK_DEFAULT_TOKEN): ''
    env(FACEBOOK_PAGE_TOKEN): ''

    facebook_app_id: '%env(FACEBOOK_APP_ID)%'
    facebook_app_secret: '%env(FACEBOOK_APP_SECRET)%'
    facebook_page_id: '%env(FACEBOOK_PAGE_ID)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            'string $facebookAppId': '%facebook_app_id%'
            'string $facebookAppSecret': '%facebook_app_secret%'
            'string $facebookPageId': '%facebook_page_id%'

    # HTTP client for the AI platforms (Mistral, Gemini): transparently retries
    # rate limits (429) and transient server errors (5xx) with exponential backoff
    # — 1s, 2s, 4s, 8s — instead of surfacing them to the caller.
    app.ai.retryable_http_client:
        class: Symfony\Component\HttpClient\RetryableHttpClient
        arguments:
            $client: '@http_client'
            $maxRetries: 4

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

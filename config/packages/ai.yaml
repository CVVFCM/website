ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
            http_client: 'ai.http_client'

        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
            http_client: 'ai.http_client'

    agent:
        forgie:
            platform: 'ai.platform.mistral'
            model:
                name: 'mistral-small-latest'
                options:
                    temperature: 0.3
                    # Mistral prompt caching: one stable key for all Forgie requests —
                    # every conversation shares the system prompt + tool definitions
                    # prefix, and same-conversation turns reuse their history prefix.
                    prompt_cache_key: 'forgie'
            tools:
                - 'App\AI\Tool\CurrentDateTimeTool'
                - 'App\AI\Tool\RegattaTool'
                - 'App\AI\Tool\WeatherForecastTool'
                - 'App\AI\Tool\LiveWeatherTool'
                - 'App\AI\Tool\HomeWeatherForecastTool'
                - 'App\AI\Tool\SeaTripTool'
                - 'App\AI\Tool\EventTool'
                - 'App\AI\Tool\SitePageTool'
                - 'App\AI\Tool\BoardMemberTool'
                - 'App\AI\Tool\LegalDocumentTool'
                - 'App\AI\Tool\SendContactMessageTool'
            prompt:
                file: '%kernel.project_dir%/config/prompts/forgie.md'

when@test:
    ai:
        agent:
            # LLM-as-judge used by the AI-judged PHPUnit tests (tests/AI/Agent) to
            # evaluate forgie's answers. No tools on purpose.
            judge:
                platform: 'ai.platform.gemini'
                model:
                    name: 'gemini-flash-lite-latest'
                    options:
                        temperature: 0

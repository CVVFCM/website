framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default (see the prod override below).

        # Namespaced pools use the above "app" backend by default
        pools:
            weather_live.cache: ~

# In prod the app cache (which backs the Doctrine result cache) lives in APCu — in-memory, per pod,
# cleared on restart. Only enabled here: dev/test SAPIs don't guarantee APCu, and there is no result
# cache outside prod anyway.
when@prod:
    framework:
        cache:
            app: cache.adapter.apcu

# Default values for cvvfcm.

image:
  # The php image is a superset (carries src/config/templates/public/bin), so web and
  # consumer both run from it. rtsp-to-web is a standalone Go service.
  # Fully qualified: OKE's runtime enforces short-name mode and rejects bare names.
  web:
    repository: ghcr.io/cvvfcm/website/php
  rtsp:
    repository: ghcr.io/cvvfcm/website/rtsp-to-web
  tag: latest
  pullPolicy: IfNotPresent

# ghcr.io/cvvfcm/website is private — CD creates a docker-registry secret named "ghcr".
imagePullSecrets:
  - name: ghcr

# FrankenPHP web server (serves the Symfony/Sulu app).
# Resources: memory request==limit (Guaranteed memory QoS). The cpu limit is deliberately
# well above the request: image formats are encoded in-process by Imagick, single-threaded
# (MAGICK_THREAD_LIMIT=1 in the Dockerfile), so a cold thumbnail is CPU-bound and a tight
# limit turns into CFS throttling on exactly the requests a visitor is waiting for.
# Starting points — tune from `kubectl top`.
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  # FrankenPHP sizes threads/workers from the HOST core count by default (it doesn't see
  # the cgroup CPU limit) — on a big node that spawns far too many PHP workers and OOMs
  # the memory limit. Pin small explicit counts that fit the resources above.
  frankenphp:
    numThreads: 8
    numWorkers: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Symfony Messenger consumer: handles the async transport (Forgie & co, doctrine-backed)
# and the Symfony Scheduler (src/Schedule.php, #[AsSchedule]) transport.
consumer:
  replicaCount: 1
  transports:
    - async
    - scheduler_default
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# One-shot Doctrine migration Job, run as a Helm release hook (post-install,pre-upgrade)
# from the same php image. Applies migrations/ before the new web/consumer pods roll.
migrate:
  enabled: true
  # migrate is idempotent, so retrying is safe; keep it low to fail fast on real errors.
  backoffLimit: 2
  # Hard cap on the whole Job (incl. the entrypoint's up-to-60s DB wait) so a hung
  # migration can't block a `helm upgrade --wait` indefinitely.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Nightly PostgreSQL backup to a restic repository on S3 (k8s CronJob, backup image).
# Repo lives under s3://<app.s3Bucket>/<repoPrefix>; the per-env bucket keeps preprod/prod repos
# separate. Retention is a Grandfather-Father-Son forget policy.
backup:
  enabled: false
  # UTC (no timeZone) — 02:00 daily.
  schedule: "0 2 * * *"
  repoPrefix: db-backups
  keep:
    daily: 8
    weekly: 4
    monthly: 12
  image:
    # Tag is shared with image.tag (built/pushed alongside php/consumer/rtsp).
    repository: ghcr.io/cvvfcm/website/backup
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# rtsp-to-web webcam streaming service. The Caddyfile reverse-proxies /stream/* to the
# Service named exactly "rtsp-to-web" (see rtsp-service.yaml).
rtsp:
  enabled: true
  replicaCount: 1
  httpLogin: admin
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Public hostname served by the app.
host: cvvfcm.fr

# Non-secret application configuration (rendered into a ConfigMap).
app:
  env: prod
  debug: "false"
  # ":80" → plain HTTP only; Caddy will not attempt auto-HTTPS (TLS is at the Gateway).
  serverName: ":80"
  suluAdminEmail: "CVVFCM <contact@cvvfcm.fr>"
  # S3-backed media storage (Sulu uploads) on Scaleway Object Storage, Paris region.
  # Endpoint/region are fixed; bucket is per-env (CD overrides). Key/secret live in the Secret.
  s3Endpoint: https://s3.fr-par.scw.cloud
  s3Region: fr-par
  s3Bucket: cvvfcm
  # Mercure hub is embedded in the web (FrankenPHP) pod. Internal URL the app/consumer POSTs
  # updates to — MUST target the web Service (the consumer pod has no local hub). Empty →
  # derived as http://<release>-web/.well-known/mercure.
  # NOTE: the hub is per-pod; keep web.replicaCount at 1 (or move to a shared hub) before scaling.
  mercureUrl: ""
  # Public URL the browser subscribes to. Empty → derived as https://<host>/.well-known/mercure.
  mercurePublicUrl: ""

# HTTP basic auth at the Traefik edge (PREPROD gate). When enabled, a Traefik Middleware
# is attached to the HTTPRoute. users = htpasswd lines (e.g. `htpasswd -nbB user pass`),
# supplied by CD from the BASIC_AUTH_USERS secret. Off in PROD.
basicAuth:
  enabled: false
  users: ""
  realm: "CVVFCM PREPROD"

# Serve a deny-all robots.txt (PREPROD gate) — overrides the allow-all file baked in the
# image so staging is not indexed. Off in PROD.
robots:
  disallowAll: false

# Loupe search index (cmsig/seal) lives on local disk under /app/var/indexes. Small RWO
# PVC so it survives pod restarts.
# mlSize sizes a second, RWX PVC for the ML weather-model artifacts under
# /app/data/weather/ml (delivered by the ML workflow, read by web AND consumer).
# uploadsSize sizes a third, RWX PVC for /app/public/uploads. Media ORIGINALS live on S3,
# but Sulu writes the GENERATED image formats to local disk (sulu_media.format_cache.path
# defaults to <project>/public/uploads/media). Without this volume every helm upgrade and
# every pod restart wipes the whole thumbnail cache, and `strategy: Recreate` guarantees a
# cold window where every image on every page is re-encoded through PHP.
persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi
  mlSize: 1Gi
  uploadsSize: 5Gi

# Bundled PostgreSQL (Bitnami subchart). When enabled, DATABASE_URL is derived
# automatically from postgresql.auth below and externalDatabase.url is ignored.
postgresql:
  enabled: false
  auth:
    username: cvvfcm
    database: cvvfcm
    # Name of a pre-existing Secret holding the DB credentials (keys: "password",
    # "postgres-password"). Owned outside the helm release so it survives uninstall
    # and never regenerates — both the subchart and the app read it. Created by CD.
    # If empty, the subchart auto-generates a password (not stable across uninstalls).
    existingSecret: ""
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
    password: ""
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi
  # Bitnami relocated its free images to docker.io/bitnamilegacy in Aug 2025. The
  # pinned chart (~18.7) still references valid images; if pulls fail, switch to the
  # legacy repo and allow it:
  #   image:
  #     repository: bitnamilegacy/postgresql
  #   global:
  #     security:
  #       allowInsecureImages: true

# External PostgreSQL — used only when postgresql.enabled is false.
externalDatabase:
  # Full Doctrine DSN, e.g.
  #   postgresql://cvvfcm:secret@db.internal:5432/cvvfcm?serverVersion=18&charset=utf8
  url: ""
  # serverVersion advertised in the DATABASE_URL derived for the bundled DB.
  serverVersion: "18"

# Secret values. Supply via --set, a values.local.yaml, or a sealed-secret.
secrets:
  appSecret: ""
  mailerDsn: ""
  symfonyDecryptionSecret: ""
  s3Key: ""
  s3Secret: ""
  rtspHttpPassword: "!ChangeMe!"
  # Signs the Mercure hub JWTs (publisher & subscriber) AND is read by the hub itself
  # (SITE_EXTRA_CONFIG references it via {env.MERCURE_JWT_SECRET}).
  mercureJwtSecret: "!ChangeThisMercureHubJWTSecretKey!"
  # Mistral API key for the Forgie agent.
  mistralApiKey: ""
  # restic repository password for the DB backup CronJob (required when backup.enabled).
  # CRITICAL: losing it makes every backup permanently unrecoverable — keep an off-cluster copy.
  backupResticPassword: ""

# Gateway API parentRef for the HTTPRoutes (the shared cluster Gateway).
gateway:
  name: main
  namespace: traefik
  secureSectionName: websecure
  insecureSectionName: web

# Pod-level security context. The image bakes EXTERNAL_USER_ID=33 (www-data);
# keep runAsUser aligned with the build arg.
podSecurityContext:
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33

securityContext: {}

serviceAccount:
  create: false
  name: ""

{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cvvfcm.fullname" . }}-indexes
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
  annotations:
    # Keep the search index across a `helm uninstall` (it is cheap to rebuild but the
    # rebuild is not automatic). Remove if you want it garbage-collected with the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cvvfcm.fullname" . }}-ml
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
  annotations:
    # Keep the ML weather-model artifacts across a `helm uninstall` — they are only
    # regenerated by the weekly ML workflow. Remove to garbage-collect with the release.
    helm.sh/resource-policy: keep
spec:
  # RWX: the artifacts are written once by the ML workflow (kubectl cp into the web pod)
  # and read by both the web and consumer pods.
  accessModes:
    - ReadWriteMany
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.mlSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cvvfcm.fullname" . }}-uploads
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
  annotations:
    # Keep the generated image formats across a `helm uninstall`: they are re-derivable
    # from the S3 originals, but only one visitor request at a time and at Imagick's
    # single-threaded pace.
    helm.sh/resource-policy: keep
spec:
  # RWX: the cache is written and read by the web pod today, but the access mode is what
  # pins replicaCount to 1 for the RWO indexes volume — don't add a second reason.
  accessModes:
    - ReadWriteMany
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.uploadsSize }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvvfcm.fullname" . }}-secret
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  # Bundled DB: DATABASE_URL is composed in the container env from the Bitnami-generated
  # password (see "cvvfcm.dbEnv"), so it is omitted here.
  DATABASE_URL: {{ required "externalDatabase.url is required (full Doctrine DSN)" .Values.externalDatabase.url | quote }}
  {{- end }}
  APP_SECRET: {{ required "secrets.appSecret is required" .Values.secrets.appSecret | quote }}
  MAILER_DSN: {{ .Values.secrets.mailerDsn | quote }}
  SYMFONY_DECRYPTION_SECRET: {{ .Values.secrets.symfonyDecryptionSecret | quote }}
  S3_KEY: {{ .Values.secrets.s3Key | quote }}
  S3_SECRET: {{ .Values.secrets.s3Secret | quote }}
  # Consumed only by the rtsp-to-web pod (via secretKeyRef), not the Sulu app.
  RTSP_HTTP_PASSWORD: {{ .Values.secrets.rtspHttpPassword | quote }}

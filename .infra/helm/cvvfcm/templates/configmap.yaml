apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cvvfcm.fullname" . }}-config
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env | quote }}
  APP_DEBUG: {{ .Values.app.debug | quote }}
  SERVER_NAME: {{ .Values.app.serverName | quote }}
  SULU_ADMIN_EMAIL: {{ .Values.app.suluAdminEmail | quote }}
  S3_ENDPOINT: {{ .Values.app.s3Endpoint | quote }}
  S3_REGION: {{ .Values.app.s3Region | quote }}
  S3_BUCKET: {{ .Values.app.s3Bucket | quote }}
  # Bound FrankenPHP threads/workers (it otherwise sizes from the host core count and
  # OOMs the pod's memory limit). CLI pods (consumer) ignore these.
  FRANKENPHP_CONFIG: {{ printf "num_threads %d" (.Values.web.frankenphp.numThreads | int) | quote }}
  FRANKENPHP_WORKER_CONFIG: {{ printf "num %d" (.Values.web.frankenphp.numWorkers | int) | quote }}
  # Embedded Mercure hub (Caddy module) in the web pod. Injected into the Caddyfile via the
  # {$SITE_EXTRA_CONFIG} placeholder; the JWT key resolves at runtime from the pod env
  # ({env.…}, provided by the Secret). Subscribing is anonymous; topics are unguessable uuids.
  SITE_EXTRA_CONFIG: |
    mercure {
        publisher_jwt {env.MERCURE_JWT_SECRET}
        subscriber_jwt {env.MERCURE_JWT_SECRET}
        anonymous
    }
  # Internal publish URL (consumer → web Service hub) and public subscribe URL.
  MERCURE_URL: {{ .Values.app.mercureUrl | default (printf "http://%s-web/.well-known/mercure" (include "cvvfcm.fullname" .)) | quote }}
  MERCURE_PUBLIC_URL: {{ .Values.app.mercurePublicUrl | default (printf "https://%s/.well-known/mercure" .Values.host) | quote }}

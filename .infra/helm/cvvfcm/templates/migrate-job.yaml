{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cvvfcm.fullname" . }}-migrate
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # One-shot schema migration, driven by Helm as a release hook:
    #   post-install → the bundled Postgres subchart is already up on a fresh install;
    #   pre-upgrade  → migrations apply before the new web/consumer pods roll.
    # Negative weight so it runs before any other hook of the same phase.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # migrate is idempotent (doctrine tracks applied versions); a couple retries ride out
  # transient DB unavailability beyond the entrypoint's own 60s wait.
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "cvvfcm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          # Reuses the php image (ships migrations/ and bin/console).
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # arg[1]=bin/console triggers the entrypoint's DB-readiness wait before migrating.
          command:
            - php
            - bin/console
            - doctrine:migrations:migrate
            - --no-interaction
            - --allow-no-migration
          envFrom:
            - configMapRef:
                name: {{ include "cvvfcm.fullname" . }}-config
            - secretRef:
                name: {{ include "cvvfcm.fullname" . }}-secret
          {{- if .Values.postgresql.enabled }}
          env:
            {{- include "cvvfcm.dbEnv" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      {{- with .Values.migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

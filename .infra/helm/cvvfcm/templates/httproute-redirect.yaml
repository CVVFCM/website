apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ include "cvvfcm.fullname" . }}-redirect
    labels:
        {{- include "cvvfcm.labels" . | nindent 8 }}
spec:
    parentRefs:
        -   name: {{ .Values.gateway.name }}
            namespace: {{ .Values.gateway.namespace }}
            sectionName: {{ .Values.gateway.insecureSectionName }}
    hostnames:
        - {{ .Values.host | quote }}
    rules:
        -   filters:
                -   type: RequestRedirect
                    requestRedirect:
                        scheme: https
                        statusCode: 301

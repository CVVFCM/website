{{- if .Values.basicAuth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvvfcm.fullname" . }}-basic-auth
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
type: Opaque
stringData:
  # htpasswd-format credentials read by the Traefik basicAuth middleware.
  users: {{ required "basicAuth.users is required when basicAuth.enabled (htpasswd lines)" .Values.basicAuth.users | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "cvvfcm.fullname" . }}-basic-auth
  labels:
    {{- include "cvvfcm.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "cvvfcm.fullname" . }}-basic-auth
    realm: {{ .Values.basicAuth.realm | quote }}
{{- end }}

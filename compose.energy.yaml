services:
    php:
        # Pins the cgroup to a predictable path so the probe can find it without being told a
        # container id, which only exists after the container does. perf counts a cgroup and its
        # descendants, so counting the slice counts the scope Docker creates beneath it.
        cgroup_parent: cvvfcm-php.slice
        environment:
            APP_ENV: prod
            S3_ENDPOINT: http://s3:9090
        depends_on: [ s3 ]
        volumes:
            - './data/weather/ml:/app/data/weather/ml:ro'
        ports:
            -   target: 80
                published: ${HTTP_PORT:-80}
                protocol: tcp
            -   target: 443
                published: ${HTTPS_PORT:-443}
                protocol: tcp
            -   target: 443
                published: ${HTTP3_PORT:-443}
                protocol: udp

    database:
        cgroup_parent: cvvfcm-database.slice

    # The image is built --no-dev, so booting it in dev mode dies on the missing profiler bundle.
    # compose.yaml resolves ${APP_ENV:-prod} against .env, which says dev.
    consumer:
        environment:
            APP_ENV: prod

    # A one-shot training/plotting container. It runs and exits, which `up --wait` reports as a
    # failure; nothing in a measurement run needs it.
    ml:
        profiles: [ ml ]

    energy-probe:
        image: ${IMAGE_PREFIX:-ghcr.io/cvvfcm/website/}energy-probe:${IMAGE_TAG:-latest}
        build:
            context: .infra/docker/energy-probe
        depends_on: [ php ]
        network_mode: 'service:php'
        cgroup: host
        cap_add: [ SYS_ADMIN, PERFMON ]
        volumes:
            - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
        environment:
            PROBE_ADDR: '127.0.0.1:9777'
            TARGETS: 'php=cvvfcm-php,database=cvvfcm-database,browser=cvvfcm-browser'

    # Chromium alone, in its own cgroup. Running it inside the playwright container would bill the
    # frontend for the test runner, the CDP protocol handling and the reporter as well.
    browser:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
        cgroup_parent: cvvfcm-browser.slice
        depends_on: [ php ]
        network_mode: 'service:php'
        working_dir: /app
        user: '${EXTERNAL_USER_ID:-1000}'
        environment:
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        volumes:
            - '.:/app:rw'
        # The image ships browsers but no playwright package, so this needs node_modules from the
        # bind mount — `make energy-up` runs npm ci before starting the stack.
        command:
            - npx
            - playwright
            - launch-server
            - --browser
            - chromium
            - --config
            - tests/energy/launch-server.json
        healthcheck:
            # /dev/tcp is a bash builtin; the image's /bin/sh is dash and has no such thing.
            test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9779" ]
            start_period: 30s

    playwright:
        profiles: [ energy ]
        environment:
            ENERGY_PROBE_URL: http://localhost:9777
            ENERGY_BROWSER_WS: ws://127.0.0.1:9779/energy

    s3:
        image: adobe/s3mock:latest
        environment:
            COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-cvvfcm}
            COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: true
        volumes:
            - s3_data:/s3mockroot

volumes:
    s3_data:

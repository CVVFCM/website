services:
    php:
        volumes:
            - '.:/app:rw'
            # Share the ML artifacts with the `ml` service so the pure-PHP inference can read
            # model_weights.json / scaler_params.json. In prod this path is a shared PVC.
            - './data/weather/ml:/app/data/weather/ml:rw'
            - './.infra/docker/php/conf.d/symfony.dev.ini:/usr/local/etc/php/conf.d/symfony.ini:ro'
        depends_on: [ mailer, s3 ]
        environment:
            CADDY_EXTRA_CONFIG: |
                https:// {
                    tls /app/.infra/tls/cert.pem /app/.infra/tls/key.pem
                }
            SITE_EXTRA_CONFIG: |
                mercure {
                    publisher_jwt {env.MERCURE_JWT_SECRET}
                    subscriber_jwt {env.MERCURE_JWT_SECRET}
                    anonymous
                }
            FRANKENPHP_SITE_CONFIG: hot_reload assets/**/*.css assets/**/*.js src/**/*.php templates/**/*.html.twig
            FRANKENPHP_WORKER_CONFIG: watch
            APP_ENV: ${APP_ENV:-dev}
            S3_ENDPOINT: http://s3:9090
        extra_hosts:
            - host.docker.internal:host-gateway
        tty: true
        command: [ "frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile" ]
        ports:
            -   target: 80
                published: ${HTTP_PORT:-80}
                protocol: tcp
            -   target: 443
                published: ${HTTPS_PORT:-443}
                protocol: tcp
            -   target: 443
                published: ${HTTP3_PORT:-443}
                protocol: udp

    mailer:
        image: axllent/mailpit
        ports: [ '${MAILER_HTTP_PORT:-8025}:8025' ]
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    database:
        ports: [ '${POSTGRES_PORT:-5432}:5432' ]

    s3:
        image: adobe/s3mock:latest
        environment:
            COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-cvvfcm}
            COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: true
        volumes:
            - s3_data:/s3mockroot

    ml:
        environment:
            - DISPLAY
        volumes:
            - '.:/app:rw'
            - './data/weather/ml:/app/data/weather/ml:rw'
            - '/tmp/.X11-unix:/tmp/.X11-unix'

    consumer:
        volumes:
            - '.:/app:rw'
            # The consumer's cron (app:import:live-weather) reads the ML artifacts for the model
            # gap columns — share them exactly like the php and ml services do.
            - './data/weather/ml:/app/data/weather/ml:rw'
        depends_on: [ mailer, s3, php ]
        environment:
            APP_ENV: ${APP_ENV:-dev}
        tty: true
        # Name the receivers (async + scheduler) — the interactive prompt would otherwise block on tty.
        command: [ "php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--failure-limit=10", "-vvv" ]

    rtsp-to-web:
        ports:
            - '${RTSP_TO_WEB_PORT:-8083}:8083'

volumes:
    s3_data:
